[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsuite"
version = "0.1.0a0"
description = "MRS Processing, Analysis, AI Model Integration, and Benchmarking"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Julian P. Merkofer", email = "j.p.merkofer@tue.nl" }]
keywords = ["MRS", "magnetic resonance spectroscopy", "NIfTI-MRS", "fitting"]

# Private for now. PyPI rejects any distribution carrying a "Private ::" classifier,
# so this makes an accidental `twine upload` fail instead of publishing. Remove this
# line (and nothing else) when the project is ready to go public.
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy",
    "pandas",
    "openpyxl",       # pandas needs it to read the challenge ground-truth .xlsx files
    "nifti-mrs",
    "nifti-mrs-plus>=0.1.0",   # the shared batched NIfTI-MRS wrapper
    "fsl_mrs",
    "oct2py",         # bridges to the FID-A Octave sources in externals/fid-a
    "lcmodel-wrapper>=0.2",   # drives the LCModel binary; 0.2 for the coord parser
    # loads the MRSI challenge; git main until a release ships MRSIChallengeDataModule
    "augmentrum @ git+https://github.com/julianmer/Augmentrum.git@main",
    "h5py",           # reads the MRSI challenge's basis set out of its .mat files
    "torch",          # the published models: WAND and the MLPs
    "huggingface_hub",   # the model zoo: from_pretrained and push_to_hub
    "safetensors",    # the Hub's format for PyTorch weights
    "ssqueezepy>=0.6.6",   # WAND's wavelet transform; 0.6.4 calls a SciPy function now removed
]

[project.optional-dependencies]
dev = ["pytest"]
train = ["keras>=3.0"]   # Model.learn: one Keras loop for PyTorch, TensorFlow and JAX models

[project.urls]
Repository = "https://github.com/julianmer/MRSuite"

[tool.setuptools.packages.find]
include = ["mrsuite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
