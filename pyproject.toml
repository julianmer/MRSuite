[build-system]
requires = ["setuptools>=77"]   # 77 for the SPDX licence string
build-backend = "setuptools.build_meta"

[project]
name = "mrsuite"
version = "0.1.0a0"
description = "MRS Processing, Analysis, AI Model Integration, and Benchmarking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Julian P. Merkofer", email = "j.p.merkofer@tue.nl" }]
keywords = ["MRS", "magnetic resonance spectroscopy", "NIfTI-MRS", "fitting"]

# Private for now. PyPI rejects any distribution carrying a "Private ::" classifier,
# so this makes an accidental `twine upload` fail instead of publishing. Remove this
# line (and nothing else) when the project is ready to go public.
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy",
    "pandas",
    "openpyxl",       # pandas needs it to read the challenge ground-truth .xlsx files
    "nifti-mrs",
    "nifti-mrs-plus>=0.2.0",   # the shared batched NIfTI-MRS wrapper; 0.2 for set_provenance
    "spec2nii",       # mrsuite.io: raw scanner data to NIfTI-MRS
    "oct2py",         # bridges to the FID-A Octave sources in externals/fid-a
    "lcmodel-wrapper>=0.3",   # drives the LCModel binary; 0.3 for __version__
    "tarquin-wrapper>=0.1",   # drives the TARQUIN binary
    "h5py",           # reads the MRSI challenge's basis set out of its .mat files
    "torch",          # the published models: WAND and the MLPs
    "huggingface_hub",   # the model zoo: from_pretrained and push_to_hub
    "safetensors",    # the Hub's format for PyTorch weights
    "ssqueezepy>=0.6.6",   # WAND's wavelet transform; 0.6.4 calls a SciPy function now removed
    # not here: FSL-MRS (conda only), Augmentrum (which needs it) and MRSValidate (not on PyPI);
    # like pyAMARES and Vespa, their parts of MRSuite say how to install them when first used
]

[project.optional-dependencies]
dev = ["pytest"]
train = ["keras>=3.0"]   # Model.learn: one Keras loop for PyTorch, TensorFlow and JAX models
gui = ["nicegui[native,plotly]>=3.17,<4"]   # mrsuite-gui; 4.0 changes its process pool and run

[project.scripts]
mrsuite-gui = "mrsuite.gui.__main__:main"

[project.urls]
Repository = "https://github.com/julianmer/MRSuite"

[tool.setuptools.packages.find]
include = ["mrsuite*"]

# what runs outside Python: the Octave shims and solver source, the R driver, the dockerfiles
[tool.setuptools.package-data]
mrsuite = ["octave/dockerfile", "octave/shims/*.m", "octave/src/*.c", "r/dockerfile", "r/*.R",
           "gui/canvas.js", "gui/static/*", "gui/vendor/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
